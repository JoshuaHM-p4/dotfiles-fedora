onboarding = false
[keys]
prefix = "ctrl+a"
goto = "prefix+s"
settings = "prefix+g"
workspace_picker = "prefix+w"
new_tab = "prefix+c"
next_tab = ["prefix+n", "ctrl+alt+]"]
previous_tab = ["prefix+p", "ctrl+alt+["]
switch_tab = "prefix+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
split_vertical = "prefix+shift+backslash"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
switch_workspace = ["prefix+shift+1..9", "ctrl+alt+1..9"]
focus_agent = ["prefix+alt+1..9", "ctrl+alt+shift+1..9"]
next_workspace = "ctrl+alt+."
previous_workspace = "ctrl+alt+,"
next_agent = "ctrl+alt+shift+]"
previous_agent = "ctrl+alt+shift+["
last_pane = "prefix+a"

# Pane layouts (layouts/layout); new worktrees get one automatically.
[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "~/.config/herdr/layouts/layout"
description = "apply pane layout"
width = 40
height = 8

[ui]
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"
accent = "#5aa469"
confirm_close = true
prompt_new_workspace_name = true
pane_gaps = false
pane_outer_borders = false
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "command", command = "git -C \"$HERDR_ACTIVE_PANE_CWD\" branch --show-current 2>/dev/null", interval_seconds = 5, timeout_seconds = 2 },
]
agent_panel_sort = "priority"

# Agent panel, per entry:
#   1. state icon · machine · workspace · tab
#   2. agent name + state word (blocked = bold red; hidden while idle)
#   3. dimmed task title (terminal title without the spinner)
# Known agents get their icon + name tinted (state still shown by symbol shape).
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "state_text", rules = [{ equals = "blocked", fg = "#e0685f", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.sidebar.agents.rows_by_agent]
omp = [
  [{ token = "state_icon", fg = "#a98cc4" }, "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#a98cc4" }, { token = "state_text", rules = [{ equals = "blocked", fg = "#e0685f", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]
claude = [
  [{ token = "state_icon", fg = "#d98e48" }, "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#d98e48" }, { token = "state_text", rules = [{ equals = "blocked", fg = "#e0685f", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]
codex = [
  [{ token = "state_icon", fg = "#5fbcae" }, "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#5fbcae" }, { token = "state_text", rules = [{ equals = "blocked", fg = "#e0685f", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]
pi = [
  [{ token = "state_icon", fg = "#d4b95e" }, "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#d4b95e" }, { token = "state_text", rules = [{ equals = "blocked", fg = "#e0685f", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "terminal_title_stripped", dim = true }],
]

# Spaces panel: workspace name tinted per workspace (state_icon can't take rules).
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", rules = [
    { equals = "home", fg = "#7fc46a" },
    { equals = "pacific-insurance-ph", fg = "#5fbcae" },
    { equals = "fnan", fg = "#d4b95e" },
    { equals = "bagwis", fg = "#d98e48" },
    { equals = "campusfindly", fg = "#a98cc4" },
    { equals = "aws-mla", fg = "#d27aa8" },
  ] }],
  [{ token = "branch", dim = true, rules = [{ equals = "main", hide = true }, { equals = "master", hide = true }] }, "git_status"],
]

[theme]
name = "catppuccin"

[theme.custom]
accent = "#5aa469"
panel_bg = "#0b211d"
active_row_bg = "#16332c"
selection_bg = "#1d4038"
surface0 = "#0b211d"
surface1 = "#16332c"
surface_dim = "#061917"
overlay0 = "#3b5c4f"
overlay1 = "#5a7566"
text = "#d7e8d0"
subtext0 = "#bcd0b6"
mauve = "#a98cc4"
green = "#7fc46a"
yellow = "#d4b95e"
red = "#e0685f"
blue = "#5fbcae"
teal = "#5fbcae"
peach = "#d98e48"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
path = "sounds/wii-remote-connect.mp3"
