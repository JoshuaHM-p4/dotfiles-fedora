set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

setw -g mode-keys vi
set -g mouse on

unbind C-b 
set-option -g prefix C-a
bind-key C-a send-prefix

# status bar customization
set -g base-index 1
set -g renumber-windows on
set -g status-position top

# set -g status-style 'bg=#02080F fg=#FFFFFF'
# set -g window-status-current-style 'fg=yellow,bold'
# set -g window-status-style 'fg=white'
# set -g status-left '#[fg=green][#S] '
# set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r | split-window -h -c "#{pane_current_path}"
bind -r - split-window -v -c "#{pane_current_path}"

# 0. Home
bind-key T run-shell 'tmux has-session -t home 2>/dev/null || tmux new-session -d -s home -c "~"; tmux switch-client -t home'

# 1. Dev
bind-key A run-shell 'tmux has-session -t dev 2>/dev/null || tmux new-session -d -s dev -c "~"; tmux switch-client -t dev'

# 2. Neovim (boots directly into nvim in the proj folder)
bind-key S run-shell 'tmux has-session -t nvim 2>/dev/null || tmux new-session -d -s nvim -c "/home/joshuam/CODE/proj" "nvim"; tmux switch-client -t nvim'

# 3. Node
bind-key D run-shell 'tmux has-session -t node 2>/dev/null || tmux new-session -d -s node -c "/home/joshuam/CODE/proj"; tmux switch-client -t node'

# 4. SSH
bind-key F run-shell 'tmux has-session -t ssh 2>/dev/null || tmux new-session -d -s ssh -c "~"; tmux switch-client -t ssh'

# 5. Git
bind-key G run-shell 'tmux has-session -t git 2>/dev/null || tmux new-session -d -s git -c "/home/joshuam/CODE/proj"; tmux switch-client -t git'

# 6. Python
bind-key H run-shell 'tmux has-session -t python 2>/dev/null || tmux new-session -d -s python -c "/home/joshuam/CODE/proj"; tmux switch-client -t python'

# 7. Notes (opens TODO.md in nvim if it exists, otherwise opens ~/Documents/todo.md)
bind-key E run-shell ' \
  tmux has-session -t notes 2>/dev/null || tmux new-session -d -s notes; \
  tmux switch-client -t notes; \
  if ! tmux select-window -t notes:=TODO 2>/dev/null; then \
    tmux new-window -t notes -n "TODO" "[ -e TODO.md ] && nvim TODO.md || nvim ~/Documents/todo.md"; \
    tmux set-window-option -t notes:=TODO allow-rename off; \
    tmux set-window-option -t notes:=TODO automatic-rename off; \
  fi'
bind-key W run-shell ' \
  tmux has-session -t notes 2>/dev/null || tmux new-session -d -s notes; \
  tmux switch-client -t notes; \
  if ! tmux select-window -t notes:=REPORT 2>/dev/null; then \
    tmux new-window -t notes -n "REPORT" "[ -e REPORT.md ] && nvim REPORT.md || nvim ~/Documents/REPORT.md"; \
    tmux set-window-option -t notes:=REPORT allow-rename off; \
    tmux set-window-option -t notes:=REPORT automatic-rename off; \
  fi'

bind-key Q run-shell ' \
  tmux has-session -t notes 2>/dev/null || tmux new-session -d -s notes; \
  tmux switch-client -t notes; \
  if ! tmux select-window -t notes:=WEEKLY_REPORT 2>/dev/null; then \
    tmux new-window -t notes -n "WEEKLY_REPORT" "[ -e WEEKLY_REPORT.md ] && nvim WEEKLY_REPORT.md || nvim ~/Documents/WEEKLY_REPORT.md"; \
    tmux set-window-option -t notes:=WEEKLY_REPORT allow-rename off; \
    tmux set-window-option -t notes:=WEEKLY_REPORT automatic-rename off; \
  fi'

# bind-key -T prefix E switch-client -t notes
# bind -r Q split-window -h -p 30 -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/Documents/todo.md"
# bind -r Q split-window -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/Documents/todo.md"

bind r source-file ~/.tmux.conf
bind-key R split-window -c "#{pane_current_path}" "nvim ~/.dotfiles/tmux/.tmux.conf"
bind-key B split-window -c "#{pane_current_path}" "nvim ~/.dotfiles/bash/.bashrc"

# --- Caps Lock Indicator ---
set -g status-interval 1 
set -ag status-right "#(~/.tmux/caps_lock.sh)"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# https://github.com/fabioluciano/tmux-powerkit/wiki/Configuration
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "hostname"
set -g @powerkit_status_order "session,windows,plugins"

# https://github.com/fabioluciano/tmux-powerkit/wiki/Configuration#theme-configuration
set -g @powerkit_bar_layout "single"
set -g @powerkit_separator_style "normal"
set -g @powerkit_transparent "true"
set -g @powerkit_edge_separator_style "rounded"
set -g @powerkit_theme_selector_key "C-t"   # Theme selector
set -g @powerkit_custom_theme_path "~/.tmux/powerkit-themes"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
